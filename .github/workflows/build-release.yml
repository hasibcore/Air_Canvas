name: Build and Release AirCanvas

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Native Windows Server Executable
        shell: cmd
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /win32manifest:app.manifest /out:AirCanvas.exe /optimize+ /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.dll AirCanvasServer.cs

      - name: Compress Windows Release Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path AirCanvas.exe, Fix_Firewall.bat -DestinationPath AirCanvas-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCanvas-Windows-x64
          path: AirCanvas-Windows-x64.zip

  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project scaffolding
        run: |
          mkdir -p /tmp/backup_manifest
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/backup_manifest/AndroidManifest.xml
          fi
          rm -rf android
          flutter create . --platforms=android --org com.aircanvas.tablet
          if [ -f /tmp/backup_manifest/AndroidManifest.xml ]; then
            cp /tmp/backup_manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Copy and rename APK
        run: |
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk AirCanvas-release.apk
          else
            find build/ -name "*.apk" -exec cp {} AirCanvas-release.apk \;
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCanvas-release.apk
          path: AirCanvas-release.apk

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    if: always() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ (github.ref_type == 'tag' && github.ref_name) || 'v1.7.1' }}
          name: AirCanvas ${{ (github.ref_type == 'tag' && github.ref_name) || 'v1.7.1' }} - Wireless Graphics Tablet
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
