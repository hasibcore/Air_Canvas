name: Build and Release AirCanvas

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Native Windows Server Executable
        shell: cmd
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /win32manifest:app.manifest /out:AirCanvas.exe /optimize+ /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.dll AirCanvasServer.cs

      - name: Compress Windows Release Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path AirCanvas.exe, Fix_Firewall.bat -DestinationPath AirCanvas-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCanvas-Windows-x64
          path: AirCanvas-Windows-x64.zip

  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project scaffolding
        run: |
          mkdir -p /tmp/backup_manifest
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/backup_manifest/AndroidManifest.xml
          fi
          rm -rf android
          flutter create . --platforms=android --org com.aircanvas.tablet
          if [ -f /tmp/backup_manifest/AndroidManifest.xml ]; then
            cp /tmp/backup_manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Align and Sign APK with v1, v2, and v3 Signature Schemes
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -name apksigner -exec dirname {} \; | sort -V | tail -n 1)
          echo "Found Android Build Tools at: $BUILD_TOOLS"

          TARGET_APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$TARGET_APK" ]; then
            TARGET_APK=$(find build/ -name "*release*.apk" | head -n 1)
          fi
          echo "Source APK: $TARGET_APK"

          # 1. Create a 2048-bit RSA Keystore valid for 25 years
          keytool -genkeypair -v -keystore aircanvas-release.keystore \
            -alias aircanvas \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass aircanvas123 -keypass aircanvas123 \
            -dname "CN=AirCanvas, OU=Mobile, O=AirCanvas, L=Dhaka, ST=Dhaka, C=BD"

          # 2. 4-byte zipalign
          $BUILD_TOOLS/zipalign -f -p 4 "$TARGET_APK" AirCanvas-aligned.apk

          # 3. Sign with v1 (JAR signing) + v2 + v3 schemes
          $BUILD_TOOLS/apksigner sign --ks aircanvas-release.keystore \
            --ks-pass pass:aircanvas123 \
            --ks-key-alias aircanvas \
            --key-pass pass:aircanvas123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out AirCanvas-release.apk \
            AirCanvas-aligned.apk

          # 4. Rigorously verify signature
          echo "=== Verifying APK Signature Schemes ==="
          $BUILD_TOOLS/apksigner verify --verbose AirCanvas-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCanvas-release.apk
          path: AirCanvas-release.apk

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    if: always() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ (github.ref_type == 'tag' && github.ref_name) || 'v1.7.2' }}
          name: AirCanvas ${{ (github.ref_type == 'tag' && github.ref_name) || 'v1.7.2' }} - Wireless Graphics Tablet
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
